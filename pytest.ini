[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    slow: testes lentos (relógio real)
    gui: testes que criam widgets Qt (offscreen)
    windows_only: só rodam no Windows
    hardware: dependem de hardware real
    isolado: o Rodar_Testes.bat roda cada um num processo próprio, com tempo limite (janela principal)
