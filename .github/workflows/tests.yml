# TEMPORÁRIO (ramo de diagnóstico zz-diag): roda variantes da suíte comum no Windows para achar o que aborta o processo.
name: Testes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (diagnóstico) ${{ matrix.variante }}
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variante: [x1_captura, x2_captura_64, x3_captura_512, g0s_young_setup, g1s_gen1_setup, g0t_young_teardown, g1t_gen1_teardown]
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Python (python_version.txt)
        id: py
        shell: bash
        run: echo "versao=$(tr -d '\r\n ' < python_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.versao }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Diagnóstico
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
          VARIANTE: ${{ matrix.variante }}
        run: |
          set +e
          mkdir -p logs
          COMUM='-q -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado"'
          case "$VARIANTE" in
            x1*) PYTEST_ADDOPTS="-p zz_manter_captura" python tests/testsupport/rodar_testes.py completo ;;
            x2*) AS_DIAG_EMPURRAO=64 PYTEST_ADDOPTS="-p zz_manter_captura" python tests/testsupport/rodar_testes.py completo ;;
            x3*) AS_DIAG_EMPURRAO=512 PYTEST_ADDOPTS="-p zz_manter_captura" python tests/testsupport/rodar_testes.py completo ;;
            g0s*) AS_DIAG_COLETA=cada AS_DIAG_GERACAO=0 AS_DIAG_ONDE=setup python -m pytest -v -s -p zz_coleta -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" ;;
            g1s*) AS_DIAG_COLETA=cada AS_DIAG_GERACAO=1 AS_DIAG_ONDE=setup python -m pytest -v -s -p zz_coleta -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" ;;
            g0t*) AS_DIAG_COLETA=cada AS_DIAG_GERACAO=0 AS_DIAG_ONDE=teardown python -m pytest -v -s -p zz_coleta -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" ;;
            g1t*) AS_DIAG_COLETA=cada AS_DIAG_GERACAO=1 AS_DIAG_ONDE=teardown python -m pytest -v -s -p zz_coleta -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" ;;
          esac
          echo "CODIGO DE SAIDA DA VARIANTE $VARIANTE: $?"
          echo "---- logs/diag_coleta.txt (fim)"; tail -n 40 logs/diag_coleta.txt 2>/dev/null
          echo "---- logs/diag_gcinfo.txt (fim)"; tail -n 160 logs/diag_gcinfo.txt 2>/dev/null
          echo "---- logs/ (arquivos)"; ls -la logs 2>/dev/null
          echo "---- zz_pids"; cat logs/zz_pids.txt 2>/dev/null | head -3
          if [ -f logs/zz_pids.txt ]; then
            PRIMEIRO=$(head -1 logs/zz_pids.txt | cut -d' ' -f1)
            for f in logs/zz_captura_${PRIMEIRO}_*.txt; do echo "==== captura $f (ultimos 3000 bytes)"; tail -c 3000 "$f"; echo; done
          fi
