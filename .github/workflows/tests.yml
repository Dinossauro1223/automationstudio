# TEMPORÁRIO (ramo de diagnóstico zz-diag): roda variantes da suíte comum no Windows para achar o que aborta o processo.
name: Testes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (diagnóstico) ${{ matrix.variante }}
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variante: [f0_rodar_testes_exato, v1_rodar_com_s, v2_rodar_com_gcinfo, v6_rodar_sem_gc, v7_rodar_gc_por_teste, v3_direto_coleta_cada, v4_direto_coleta_primeiro_dialogo]
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Python (python_version.txt)
        id: py
        shell: bash
        run: echo "versao=$(tr -d '\r\n ' < python_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.versao }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Diagnóstico
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
          VARIANTE: ${{ matrix.variante }}
        run: |
          set +e
          mkdir -p logs
          COMUM='-q -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado"'
          case "$VARIANTE" in
            f0*) python tests/testsupport/rodar_testes.py completo ;;
            v1*) PYTEST_ADDOPTS="-s" python tests/testsupport/rodar_testes.py completo ;;
            v2*) PYTEST_ADDOPTS="-p zz_gcinfo" python tests/testsupport/rodar_testes.py completo ;;
            v6*) PYTEST_ADDOPTS="-p zz_nogc" python tests/testsupport/rodar_testes.py completo ;;
            v7*) PYTEST_ADDOPTS="-p zz_gcprobe" python tests/testsupport/rodar_testes.py completo ;;
            v3*) AS_DIAG_COLETA=cada python -m pytest -v -s -p zz_coleta -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" ;;
            v4*) AS_DIAG_COLETA=primeiro_dialogo python -m pytest -v -s -p zz_coleta -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" ;;
          esac
          echo "CODIGO DE SAIDA DA VARIANTE $VARIANTE: $?"
          echo "---- logs/diag_coleta.txt (fim)"; tail -n 40 logs/diag_coleta.txt 2>/dev/null
          echo "---- logs/diag_gcinfo.txt (fim)"; tail -n 160 logs/diag_gcinfo.txt 2>/dev/null
          echo "---- logs/ (arquivos)"; ls -la logs 2>/dev/null
