# TEMPORÁRIO (ramo de diagnóstico zz-diag): roda variantes da suíte comum no Windows para achar o que aborta o processo.
name: Testes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (diagnóstico) ${{ matrix.variante }}
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variante: [e0_so_env_qt, t0_total_0, t1_total_64, t2_total_512, t3_total_1000, t4_total_200]
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Python (python_version.txt)
        id: py
        shell: bash
        run: echo "versao=$(tr -d '\r\n ' < python_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.versao }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Diagnóstico
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
          VARIANTE: ${{ matrix.variante }}
        run: |
          set +e
          mkdir -p logs
          COMUM='-q -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado"'
          export QT_FORCE_STDERR_LOGGING=1
          case "$VARIANTE" in
            e0*) python tests/testsupport/rodar_testes.py completo ;;
            t0*) AS_DIAG_EMPURRAO=0 PYTEST_ADDOPTS="-p zz_diag_total" python tests/testsupport/rodar_testes.py completo ;;
            t1*) AS_DIAG_EMPURRAO=64 PYTEST_ADDOPTS="-p zz_diag_total" python tests/testsupport/rodar_testes.py completo ;;
            t2*) AS_DIAG_EMPURRAO=512 PYTEST_ADDOPTS="-p zz_diag_total" python tests/testsupport/rodar_testes.py completo ;;
            t3*) AS_DIAG_EMPURRAO=1000 PYTEST_ADDOPTS="-p zz_diag_total" python tests/testsupport/rodar_testes.py completo ;;
            t4*) AS_DIAG_EMPURRAO=200 PYTEST_ADDOPTS="-p zz_diag_total" python tests/testsupport/rodar_testes.py completo ;;
          esac
          echo "CODIGO DE SAIDA DA VARIANTE $VARIANTE: $?"
          echo "---- logs/diag_coleta.txt (fim)"; tail -n 40 logs/diag_coleta.txt 2>/dev/null
          echo "---- logs/diag_gcinfo.txt (fim)"; tail -n 160 logs/diag_gcinfo.txt 2>/dev/null
          echo "---- logs/ (arquivos)"; ls -la logs 2>/dev/null
          echo "---- zz_pilha_nativa"; cat logs/zz_pilha_nativa.txt 2>/dev/null | head -150
          echo "---- zz_pids"; cat logs/zz_pids.txt 2>/dev/null | head -3
          if [ -f logs/zz_pids.txt ]; then
            PRIMEIRO=$(head -1 logs/zz_pids.txt | cut -d' ' -f1)
            for f in logs/zz_captura_${PRIMEIRO}_*.txt; do echo "==== captura $f (ultimos 3000 bytes)"; tail -c 3000 "$f"; echo; done
          fi
