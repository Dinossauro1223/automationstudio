# TEMPORÁRIO (ramo de diagnóstico zz-diag): roda variantes da suíte comum no Windows para achar o que aborta o processo.
name: Testes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (diagnóstico) ${{ matrix.variante }}
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variante: [a_basico_sem_captura, b_gc_com_estresse, c_gc_sem_estresse, d_sem_gc_automatico]
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Python (python_version.txt)
        id: py
        shell: bash
        run: echo "versao=$(tr -d '\r\n ' < python_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.versao }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Diagnóstico
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
          VARIANTE: ${{ matrix.variante }}
        run: |
          set +e
          EST="tests/engine/test_engine_control.py::test_pausar_e_continuar_sem_parar_de_outra_thread_nao_perde_nem_repete_nem_trava"
          BASE="python -m pytest -v -s -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m not_isolado_placeholder"
          case "$VARIANTE" in
            a*) python -m pytest -v -s -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" ;;
            b*) python -m pytest -v -s -p zz_gcprobe -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" ;;
            c*) python -m pytest -v -s -p zz_gcprobe -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" --deselect "$EST" ;;
            d*) python -m pytest -v -s -p zz_nogc -o cache_dir=logs/.pytest_cache --tb=line --timeout=180 -m "not isolado" ;;
          esac
          echo "CODIGO DE SAIDA DA VARIANTE $VARIANTE: $?"
