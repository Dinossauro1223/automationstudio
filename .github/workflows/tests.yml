# Testes automáticos a cada push na main e a cada pull request.
#
# - Job "linux": é o que foi rodado de verdade na integração de 30/10/2026 (Python 3.14, PySide6 6.12, display virtual).
#   Falhar aqui = algo quebrou. É o que deve bloquear a junção.
# - Job "windows": INFORMATIVO (continue-on-error). Roda a mesma suíte no Windows, com o Qt sem janela (offscreen). Serve
#   para (1) pegar o que só o Windows mostra e (2) coletar os dados do travamento do 22º teste da janela principal
#   (md/PONTO2_REVISAO_25_6.md, R3): os logs ficam anexados à execução, em "Artifacts". Quando estiver estável, tire o
#   continue-on-error.
# - NUNCA roda o modo "windows" do Rodar_Testes.bat (ele envia teclado e mouse de verdade).
# A versão do Python vem de python_version.txt (fonte única, como nos .bat).

name: Testes

on:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Python 3.14, Qt de verdade, display virtual)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Python (python_version.txt)
        id: py
        shell: bash
        run: echo "versao=$(tr -d '\r\n ' < python_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.versao }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Bibliotecas do sistema para o Qt sem tela
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Suíte completa
        env:
          PYTHONUTF8: "1"
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python tests/testsupport/rodar_testes.py completo
      - name: Guardar os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux
          path: logs/
          if-no-files-found: ignore

  windows:
    name: Windows (informativo)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Python (python_version.txt)
        id: py
        shell: bash
        run: echo "versao=$(tr -d '\r\n ' < python_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.versao }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Suíte completa
        env:
          PYTHONUTF8: "1"
          QT_QPA_PLATFORM: offscreen
        run: python tests/testsupport/rodar_testes.py completo
      - name: Guardar os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows
          path: logs/
          if-no-files-found: ignore

  varredura:
    name: Windows (validação da correção) ${{ matrix.forma }}
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        forma: [plano, s0, s32, s64, s128, s200, s300, s512, s700, s1000]
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Python (python_version.txt)
        id: py
        shell: bash
        run: echo "versao=$(tr -d '\r\n ' < python_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.versao }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Suíte com a correção, com o ponto da coleta de lixo deslocado
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
          FORMA: ${{ matrix.forma }}
        run: |
          set +e
          mkdir -p logs
          if [ "$FORMA" = "plano" ]; then
            python tests/testsupport/rodar_testes.py completo
          else
            N="${FORMA#s}"
            AS_DIAG_EMPURRAO="$N" PYTEST_ADDOPTS="-p zz_diag_total" python tests/testsupport/rodar_testes.py completo
          fi
          echo "CODIGO DE SAIDA DA FORMA $FORMA: $?"
          echo "---- zz_pilha_nativa"; cat logs/zz_pilha_nativa.txt 2>/dev/null | head -60
